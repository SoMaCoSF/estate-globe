# Estate Globe screen saver: hypridle wiring for Omarchy / Somacomarchy.
#
# 1. Link the launcher onto your PATH:
#      ln -s /path/to/estate-globe/screensaver ~/.local/bin/estate-globe
# 2. Merge the listener block below into ~/.config/hypr/hypridle.conf
#    (do not duplicate the general block if your config already has one).
# 3. Restart hypridle:  systemctl --user restart hypridle
#
# On resume, hypridle kills the kiosk browser and the local server by
# their command line patterns. If you changed ESTATE_GLOBE_PORT, change
# the port in the on-resume line to match.

listener {
    timeout = 600
    on-timeout = ~/.local/bin/estate-globe
    on-resume = pkill -f "app=http://127.0.0.1:8791" ; pkill -f "http.server 8791"
}
